[package]
name = "driver-mysql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axdb-driver-sdk = { path = "../driver-sdk" }
dbcore.workspace = true
async-trait.workspace = true
futures-util = "0.3"
