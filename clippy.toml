msrv = "1.99"
allow-unwrap-in-tests = true
allow-expect-in-tests = true
# Clippy cannot express a type-specific prohibition on holding std::sync::Mutex
# guards across await points. The await_holding_lock lint remains enabled; use
# async-aware locks or release synchronous guards before every await.
disallowed-macros = ["std::dbg"]
allow-print-in-tests = true
