[package]
name = "axdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"
zstd = "0.13"
csv = "1.4"
calamine = "0.36"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
ring = "0.17"
sqlparser = { version = "0.63", features = ["visitor"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
url = "2"
percent-encoding = "2"
shell-words = "1"
native-tls = "0.2"
tokio-native-tls = "0.3"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
axdb-driver-package = { path = "../crates/driver-package" }
semver = "1"
axdb-driver-protocol = { path = "../crates/driver-protocol" }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "query", "form"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
dbcore.workspace = true
async-trait.workspace = true
serde.workspace = true
rmp-serde = "1.3"
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = "0.10.9"
tokio.workspace = true
tokio-util.workspace = true
mimalloc = { version = "=0.1.52", default-features = false }
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
futures-util = "0.3"
tokio-postgres = "0.7"
mongodb = "3.9.1"
tempfile = "3"
redis.workspace = true
driver-postgres = { path = "../crates/driver-postgres" }
driver-mysql = { path = "../crates/driver-mysql" }
driver-neo4j = { path = "../crates/driver-neo4j" }
driver-sqlite = { path = "../crates/driver-sqlite" }
driver-mongodb = { path = "../crates/driver-mongodb" }
driver-redis = { path = "../crates/driver-redis" }
tauri = { version = "2", features = ["test"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSObject"] }

[lints]
workspace = true
